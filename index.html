<html lang="ru">

  <title>Galaxy Spin</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #030014;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      padding-top: 50px;
    }
    .balance-bar {
      position: absolute;
      top: 15px; right: 15px;
      background: rgba(30, 27, 75, 0.9);
      border: 1px solid rgba(168, 85, 247, 0.5);
      padding: 6px 14px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 700;
      color: #facc15;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 50;
    }
    .bal-plus-btn {
      background: #a855f7; color: #fff; border: none;
      width: 26px; height: 26px; border-radius: 50%;
      font-weight: bold; cursor: pointer;
    }
    h1 { font-size: 24px; color: #c084fc; margin-bottom: 20px; text-align: center; }
    
    .wheel-container {
      position: relative;
      width: 260px;
      height: 260px;
      margin-bottom: 25px;
    }
    .pointer {
      position: absolute; top: -12px; left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 22px solid #f43f5e;
      z-index: 10;
    }
    .wheel-box {
      width: 260px; height: 260px;
      border-radius: 50%;
      background: conic-gradient(
        #ec4899 0deg 72deg, 
        #1e1b4b 72deg 144deg, 
        #a855f7 144deg 216deg, 
        #3b82f6 216deg 288deg, 
        #06b6d4 288deg 360deg
      );
      border: 4px solid #c084fc;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
      transition: transform 4s cubic-bezier(0.15, 0.85, 0.35, 1);
    }

      width: 70px; height: 70px;
