<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Spin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #030014;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    .space-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, #030014 100%);
      z-index: 0;
    }

    .balance-bar {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(30, 27, 75, 0.8);
      border: 1px solid rgba(168, 85, 247, 0.5);
      padding: 6px 14px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 700;
      color: #facc15;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    .bal-plus-btn {
      background: #a855f7;
      color: #fff;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 26px;
      font-weight: 900;
      margin-top: 20px;
      margin-bottom: 15px;
      color: #c084fc;
      z-index: 2;
    }

    .wheel-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin-bottom: 20px;
      z-index: 2;
    }

    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #f43f5e;
      z-index: 10;
    }

    .center-cap {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 50px; height: 50px;
      background: #1e1b4b;
      border: 3px solid #c084fc;
      border-radius: 50%;
      z-index: 5;
    }

    canvas {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      z-index: 2;
    }

    .controls-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 280px;
      z-index: 2;
    }

    .btn-spin {
      background: linear-gradient(135deg, #a855f7, #6366f1);
      color: #fff;
      border: none;
      padding: 14px 0;
      font-size: 18px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      width: 100%;
    }

    .btn-spin:disabled { opacity: 0.5; }

    .btn-inventory {
      background: rgba(30, 27, 75, 0.9);
      border: 1px solid #c084fc;
      color: #fff;
      padding: 10px 0;
      font-size: 15px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      width: 100%;
    }

    .result {
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      color: #facc15;
      min-height: 24px;
      z-index: 2;
      text-align: center;
    }

    .modal {
      position: fixed;
      bottom: -100%;
      left: 0; right: 0;
      background: #1e1b4b;
      border-top: 3px solid #a855f7;
      border-radius: 25px 25px 0 0;
      padding: 20px;
      z-index: 90;
      transition: bottom 0.4s ease;
      text-align: center;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    .modal.show { bottom: 0; }

    .action-btn {
      width: 100%; padding: 12px; border-radius: 12px; border: none;
      font-size: 15px; font-weight: bold; margin-top: 8px; cursor: pointer;
    }
    .btn-claim { background: #10b981; color: #fff; }
    .btn-exchange { background: #eab308; color: #000; }
    .btn-close { background: #475569; color: #fff; margin-top: 15px; }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 15px;
      overflow-y: auto;
      max-height: 250px;
      padding: 5px;
    }

    .inventory-item {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 12px;
      padding: 10px 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
    }
    .inventory-item:active { transform: scale(0.95); }
    .item-icon { font-size: 32px; }
    .item-name { font-size: 12px; margin-top: 4px; color: #cbd5e1; }
    .item-price { font-size: 11px; color: #facc15; font-weight: bold; }
    .item-count {
      position: absolute;
      top: 4px; right: 6px;
      background: #a855f7;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="space-bg"></div>

  <div class="balance-bar">
    <span id="balanceVal">10</span> ⭐
    <button class="bal-plus-btn" onclick="openDeposit()">+</button>
  </div>

  <h1>GALAXY SPIN</h1>

  <div class="wheel-container">
    <div class="pointer"></div>
    <div class="center-cap"></div>
    <canvas id="wheel" width="280" height="280"></canvas>
  </div>

  <div class="controls-group">
    <button class="btn-spin" id="spinBtn
