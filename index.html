<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Spin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #030014;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Анимированный космический фон со звездами */
    .space-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at 20% 20%, rgba(147, 51, 234, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, #030014 100%);
      z-index: 0;
    }

    h1 {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 25px;
      text-align: center;
      background: linear-gradient(135deg, #a855f7, #38bdf8, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
      z-index: 2;
    }

    /* Контейнер колеса и рамки */
    .wheel-wrapper {
      position: relative;
      width: 330px;
      height: 330px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    /* Космическая внешняя тарелка / обод */
    .wheel-frame {
      position: absolute;
      width: 330px;
      height: 330px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1e1b4b, #0f172a);
      border: 4px solid #38bdf8;
      box-shadow: 
        0 0 20px #a855f7,
        inset 0 0 15px #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Кастомная кристаллическая стрелка */
    .pointer {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 42px;
      z-index: 10;
      filter: drop-shadow(0 0 12px #f43f5e);
    }
    .pointer-shape {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #ff4b72, #9f1239);
      clip-path: polygon(50% 100%, 0 0, 50% 20%, 100% 0);
      border-radius: 4px;
    }

    /* Центр рулетки (неоновый кристалл) */
    .center-cap {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, #38bdf8 0%, #030014 90%);
      border: 3px solid #a855f7;
      border-radius: 50%;
      z-index: 5;
      box-shadow: 0 0 20px #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .center-cap::after {
      content: '✦';
      font-size: 20px;
      color: #fff;
      text-shadow: 0 0 10px #38bdf8;
    }

    canvas {
      position: relative;
      z-index: 3;
      width: 300px;
      height: 300px;
      border-radius: 50%;
    }

    .btn {
      margin-top: 35px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
      background-size: 200% 200%;
      animation: gradientShift 4s ease infinite;
      color: #fff;
      border: none;
      padding: 18px 50px;
      font-size: 20px;
      font-weight: 800;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.6);
      transition: all 0.2s;
      z-index: 2;
      letter-spacing: 1px;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      min-height: 32px;
      color: #facc15;
      text-shadow: 0 0 15px rgba(250, 204, 21, 0.7);
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="space-bg"></div>

  <h1>GALAXY SPIN</h1>

  <div class="wheel-wrapper">
    <div class="pointer">
      <div class="pointer-shape"></div>
    </div>
    <div class="wheel-frame">
      <canvas id="wheel" width="600" height="600"></canvas>
    </div>
    <div class="center-cap"></div>
  </div>

  <button class="btn" id="spinBtn" onclick="spin()">КРУТИТЬ</button>
  <div class="result" id="resultText"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const resultText = document.getElementById('resultText');

    const sectors = [
      { label: "100 ⭐", color: "#ec4899", chance: 1 },
      { label: "ПУСТО 🌌", color: "#0b0f19", chance: 34.5 },
      { label: "50 ⭐", color: "#8b5cf6", chance: 5 },
      { label: "ПУСТО 🌌", color: "#090d16", chance: 34.5 },
      { label: "25 ⭐", color: "#3b82f6", chance: 10 },
      { label: "15 ⭐", color: "#06b6d4", chance: 15 }
    ];

    const numSectors = sectors.length;
    const arc = (2 * Math.PI) / numSectors;
    let currentAngle = 0;
    let isSpinning = false;

    function drawWheel() {
      const radius = canvas.width / 2;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numSectors; i++) {
        const angle = currentAngle + i * arc;
        
        // Сектор
        ctx.beginPath();
        ctx.fillStyle = sectors[i].color;
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, angle, angle + arc);
        ctx.lineTo(radius, radius);
        ctx.fill();

        // Неоновая разделительная линия
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
        ctx.lineWidth = 4;
        ctx.stroke();
