<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Wheel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #1b1035 0%, #080415 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 20px;
      text-align: center;
      color: #c084fc;
      text-shadow: 0 0 15px rgba(192, 132, 252, 0.6);
      letter-spacing: 1px;
    }
    .wheel-container {
      position: relative;
      width: 320px;
      height: 320px;
      margin-bottom: 30px;
    }
    .wheel-container::before {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      border-radius: 50%;
      background: linear-gradient(45deg, #a855f7, #ec4899, #3b82f6);
      z-index: 1;
      filter: blur(10px);
      opacity: 0.7;
    }
    .pointer {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 28px solid #f43f5e;
      z-index: 10;
      filter: drop-shadow(0 0 10px #f43f5e);
    }
    .center-cap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 54px;
      height: 54px;
      background: radial-gradient(circle, #38bdf8 0%, #1e1b4b 100%);
      border: 3px solid #c084fc;
      border-radius: 50%;
      z-index: 5;
      box-shadow: 0 0 15px #38bdf8;
    }
    canvas {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }
    .btn {
      background: linear-gradient(135deg, #a855f7, #6366f1);
      color: #fff;
      border: none;
      padding: 16px 45px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }
    .result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      min-height: 30px;
      color: #facc15;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
    }
  </style>
</head>
<body>

  <h1>🌌 Галактическая Рулетка</h1>

  <div class="wheel-container">
    <div class="pointer"></div>
    <div class="center-cap"></div>
    <canvas id="wheel" width="600" height="600"></canvas>
  </div>

  <button class="btn" id="spinBtn" onclick="spin()">КРУТИТЬ</button>
  <div class="result" id="resultText"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const resultText = document.getElementById('resultText');

    const sectors = [
      { label: "100 ⭐", color: "#ec4899", chance: 1 },
      { label: "ПУСТО 🌌", color: "#1e1b4b", chance: 34.5 },
      { label: "50 ⭐", color: "#a855f7", chance: 5 },
      { label: "ПУСТО 🌌", color: "#0f172a", chance: 34.5 },
      { label: "25 ⭐", color: "#3b82f6", chance: 10 },
      { label: "15 ⭐", color: "#06b6d4", chance: 15 }
    ];

    const numSectors = sectors.length;
    const arc = (2 * Math.PI) / numSectors;
    let currentAngle = 0;
    let isSpinning = false;

    function drawWheel() {
      const radius = canvas.width / 2;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numSectors; i++) {
        const angle = currentAngle + i * arc;
        
        ctx.beginPath();
        ctx.fillStyle = sectors[i].color;
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, angle, angle + arc);
        ctx.lineTo(radius, radius);
        ctx.fill();

        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 28px sans-serif";
        ctx.shadowColor = "#000";
        ctx.shadowBlur = 8;
        ctx.textAlign = "right";
        ctx.translate(radius, radius);
        ctx.rotate(angle + arc / 2);
        ctx.fillText(sectors[i].label, radius - 35, 10);
        ctx.restore();
      }
    }

    function getRandomSectorIndex() {
      const rand = Math.random() * 100;
      if (rand < 1) return 0;
      if (rand < 6) return 2;
      if (rand < 16) return 4;
      if (rand < 31) return 5;
      return Math.random() < 0.5 ? 1 : 3;
    }

    function spin() {
      if (isSpinning) return;
      isSpinning = true;
      spinBtn.disabled = true;
      resultText.innerText = "Полет сквозь галактику...";

      const winningIndex = getRandomSectorIndex();
      const targetAngleOnCircle = 2 * Math.PI - (winningIndex * arc + arc / 2) - Math.PI / 2;
      const extraRotations = (5 + Math.floor(Math.random() * 3)) * 2 * Math.PI;
      const currentMod = currentAngle % (2 * Math.PI);
      const targetAngle = currentAngle + extraRotations + (targetAngleOnCircle - currentMod + 2 * Math.PI) % (2 * Math.PI);

      const duration = 4500;
      const startAngle = currentAngle;
      const startTime = performance.now();

      function animate(time) {
        let elapsed = time - startTime;
        if (elapsed > duration) elapsed = duration;

        const progress = elapsed / duration;
        const easeOut = 1 - Math.pow(1 - progress, 3);

        currentAngle = startAngle + (targetAngle - startAngle) * easeOut;
        drawWheel();

        if (elapsed < duration) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          spinBtn.disabled = false;
          showResult(winningIndex);
        }
      }

      requestAnimationFrame(animate);
    }

    function showResult(index) {
      const prize = sectors[index].label;
      if (prize.includes("ПУСТО")) {
        resultText.innerText = "Увы, в этот раз пусто! Попробуй еще раз 🌌";
      } else {
        resultText.innerText = `🎉 Поздравляем! Ваш выигрыш: ${prize}`;
        if (tg?.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('success');
        }
      }
    }

    drawWheel();
  </script>
</body>
  </html>
