<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Spin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #030014;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Космический фон */
    .space-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at 20% 20%, rgba(147, 51, 234, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, #030014 100%);
      z-index: 0;
    }

    /* Шапка: Шестерёнка + Бар Баланса */
    .top-bar {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .settings-btn {
      background: rgba(30, 27, 75, 0.8);
      border: 1px solid rgba(168, 85, 247, 0.5);
      color: #fff;
      font-size: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
      backdrop-filter: blur(10px);
    }

    .balance-bar {
      background: rgba(30, 27, 75, 0.8);
      border: 1px solid rgba(168, 85, 247, 0.5);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 700;
      color: #facc15;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bal-btn {
      background: rgba(168, 85, 247, 0.3);
      border: 1px solid #a855f7;
      color: #fff;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 26px;
      font-weight: 900;
      margin-top: 50px;
      margin-bottom: 20px;
      text-align: center;
      background: linear-gradient(135deg, #a855f7, #38bdf8, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
      z-index: 2;
    }

    /* Колесо и тарелка */
    .wheel-wrapper {
      position: relative;
      width: 310px;
      height: 310px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .wheel-frame {
      position: absolute;
      width: 310px;
      height: 310px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1e1b4b, #0f172a);
      border: 4px solid #38bdf8;
      box-shadow: 0 0 20px #a855f7, inset 0 0 15px #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pointer {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 42px;
      z-index: 10;
      filter: drop-shadow(0 0 12px #f43f5e);
    }
    .pointer-shape {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #ff4b72, #9f1239);
      clip-path: polygon(50% 100%, 0 0, 50% 20%, 100% 0);
      border-radius: 4px;
    }

    .center-cap {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 56px; height: 56px;
      background: radial-gradient(circle, #38bdf8 0%, #030014 90%);
      border: 3px solid #a855f7;
      border-radius: 50%;
      z-index: 5;
      box-shadow: 0 0 20px #38bdf8;
      display: flex; align-items: center; justify-content: center;
    }
    .center-cap::after {
      content: '✦';
      font-size: 20px;
      color: #fff;
    }

    canvas {
      position: relative;
      z-index: 3;
      width: 280px;
      height: 280px;
      border-radius: 50%;
    }

    .btn-spin {
      margin-top: 25px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
      background-size: 200% 200%;
      animation: gradientShift 4s ease infinite;
      color: #fff;
      border: none;
      padding: 16px 40px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.6);
      transition: all 0.2s;
      z-index: 2;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .btn-spin:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Модальное меню Настроек / Профиля */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 0, 20, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #1e1b4b;
      border: 2px solid #a855f7;
      border-radius: 24px;
      padding: 25px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 15px; right: 15px;
      background: none; border: none;
      color: #a855f7; font-size: 22px; cursor: pointer;
    }
    .nav-tabs {
      display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid rgba(168, 85, 247, 0.3); padding-bottom: 10px;
    }
    .tab-btn {
      background: none; border: none; color: #a855f7; font-weight: 700; cursor: pointer; padding: 5px 8px; font-size: 14px;
    }
    .tab-btn.active {
      color: #38bdf8; border-bottom: 2px solid #38bdf8;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Поп-ап Выигрыша с Подарком */
    .gift-modal {
      position: fixed;
      bottom: -100%;
      left: 0; right: 0;
      background: linear-gradient(180deg, #1e1b4b 0%, #090d16 100%);
      border-top: 3px solid #ec4899;
      border-radius: 30px 30px 0 0;
      padding: 30px 20px;
      z-index: 90;
      box-shadow: 0 -10px 40px rgba(236, 72, 153, 0.5);
      transition: bottom 0.4s ease-in-out;
      text-align: center;
    }
    .gift-modal.show {
      bottom: 0;
    }
    .gift-icon {
      font-size: 60px;
      margin-bottom: 10px;
      animation: bounce 1.5s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .action-btn {
      width: 100%;
      padding: 14px;
      border-radius: 15px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      margin-top: 10px;
      cursor: pointer;
    }
    .btn-claim { background: #10b981; color: #fff; }
    .btn-exchange { background: #3b82f6; color: #fff; }

    .result-status {
      margin-top: 15px; font-size: 16px; min-height: 24px; color: #facc15; font-weight: 700; text-align: center; z-index: 2;
    }
  </style>
</head>
<body>

  <div class="space-bg"></div>

  <!-- Шапка -->
  <div class="top-bar">
    <button class="settings-btn" onclick="openModal()">⚙️</button>

    <div class="balance-bar">
      <button class="bal-btn" onclick="changeBalance(-5)">-</button>
      <span id="balanceVal">10</span> ⭐
      <button class="bal-btn" onclick="changeBalance(10)">+</button>
    </div>
  </div>

  <h1>GALAXY SPIN</h1>

  <!-- Колесо -->
  <div class="wheel-wrapper">
    <div class="pointer"><div class="pointer-shape"></div></div>
    <div class="wheel-frame">
      <canvas id="wheel" width="600" height="600"></canvas>
    </div>
    <div class="center-cap"></div>
  </div>

  <button class="btn-spin" id="spinBtn" onclick="spin()">КРУТИТЬ (5 ⭐)</button>
  <div class="result-status" id="resultText"></div>

  <!-- Окно настроек ⚙️ -->
  <div class="modal" id="menuModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">✕</button>
      
      <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('profile')">Профиль</button>
        <button class="tab-btn" onclick="switchTab('balance')">Баланс</button>
        <button class="tab-btn" onclick="switchTab('deposit')">Пополнение</button>
      </div>

      <div class="tab-content active" id="tab-profile">
        <h3>👤 Профиль</h3>
        <p style="margin-top: 10px; color: #cbd5e1;" id="usernameText">Игрок: Telegram User</p>
      </div>

      <div class="tab-content" id="tab-balance">
        <h3>💰 Ваш Баланс</h3>
        <p style="margin-top: 10px; font-size: 22px; color: #facc15;"><span id="modalBal">10</span> ⭐</p>
      </div>

      <div class="tab-content" id="tab-deposit">
        <h3>⭐ Пополнение</h3>
        <p style="margin-top: 8px; font-size: 14px; color: #94a3b8;">Пополнение через Telegram Stars:</p>
        <button class="action-btn btn-exchange" style="margin-top: 15px;" onclick="changeBalance(50); closeModal();">Купить +50 ⭐</button>
      </div>
    </div>
  </div>

  <!-- Поп-ап Выигрыша с Подарком -->
  <div class="gift-modal" id="giftModal">
    <div class="gift-icon">🎁</div>
    <h2 id="giftTitle">Вам выпал приз!</h2>
    <p id="giftDesc" style="color: #cbd5e1; margin: 8px 0 15px;">Вы можете забрать его или обменять на баланс ⭐</p>
    
    <button class="action-btn btn-claim" onclick="claimGift()">🎁 Забрать подарок</button>
    <button class="action-btn btn-exchange" onclick="exchangeGift()">⭐ Обменять на баланс</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      if (tg.initDataUnsafe?.user) {
        document.getElementById('usernameText').innerText = `Игрок: ${tg.initDataUnsafe.user.first_name}`;
      }
    }

    const SPIN_COST = 5;
    let userBalance = parseInt(localStorage.getItem('starsBalance')) || 10;
    let currentPrize = null;

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const resultText = document.getElementById('resultText');
    const balanceVal = document.getElementById('balanceVal');
    const modalBal = document.getElementById('modalBal');

    function updateUI() {
      balanceVal.innerText = userBalance;
      modalBal.innerText = userBalance;
      localStorage.setItem('starsBalance', userBalance);

      if (userBalance < SPIN_COST && !isSpinning) {
        spinBtn.disabled = true;
        resultText.innerText = "Недостаточно ⭐ для вращения!";
      } else if (!isSpinning) {
        spinBtn.disabled = false;
      }
    }

    function changeBalance(amount) {
      userBalance = Math.max(0, userBalance + amount);
      updateUI();
    }

    const sectors = [
      { label: "100 ⭐", value: 100, color: "#ec4899" },
      { label: "ПУСТО 🌌", value: 0, color: "#0b0f19" },
      { label: "50 ⭐", value: 50, color: "#8b5cf6" },
      { label: "ПУСТО 🌌", value: 0, color: "#090d16" },
      { label: "25 ⭐", value: 25, color: "#3b82f6" },
      { label: "15 ⭐", value: 15, color: "#06b6d4" }
    ];

    const numSectors = sectors.length;
    const arc = (2 * Math.PI) / numSectors;
    let currentAngle = 0;
    let isSpinning = false;

    function drawWheel() {
      const radius = canvas.width / 2;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numSectors; i++) {
        const angle = currentAngle + i * arc;
        
        ctx.beginPath();
        ctx.fillStyle = sectors[i].color;
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, angle, angle + arc);
        ctx.lineTo(radius, radius);
        ctx.fill();

        ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 32px sans-serif";
        ctx.shadowColor = "#000";
        ctx.shadowBlur = 10;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const midAngle = angle + arc / 2;
        const textRadius = radius * 0.65;
        const x = radius + Math.cos(midAngle) * textRadius;
        const y = radius + Math.sin(midAngle) * textRadius;

        ctx.translate(x, y);

        let textAngle = midAngle;
        if (midAngle % (2 * Math.PI) > Math.PI / 2 && midAngle % (2 * Math.PI) < (3 * Math.PI) / 2) {
          textAngle += Math.PI;
        }

        ctx.rotate(textAngle);
        ctx.fillText(sectors[i].label, 0, 0);
        ctx.restore();
      }
    }

    function getRandomSectorIndex() {
      const rand = Math.random() * 100;
      if (rand < 1) return 0;
      if (rand < 6) return 2;
      if (rand < 16) return 4;
      if (rand < 31) return 5;
      return Math.random() < 0.5 ? 1 : 3;
    }

    function spin() {
      if (isSpinning || userBalance < SPIN_COST) return;

      changeBalance(-SPIN_COST);
      isSpinning = true;
      spinBtn.disabled = true;
      resultText.innerText = "Гиперпространственный прыжок...";

      const winningIndex = getRandomSectorIndex();

      const randomPointInsideSector = Math.random() * (arc * 0.8) + (arc * 0.1);
      const targetAngleOnCircle = 2 * Math.PI - (winningIndex * arc + randomPointInsideSector) - Math.PI / 2;

      const extraRotations = (6 + Math.floor(Math.random() * 4)) * 2 * Math.PI;
      const currentMod = currentAngle % (2 * Math.PI);
      const targetAngle = currentAngle + extraRotations + (targetAngleOnCircle - currentMod + 2 * Math.PI) % (2 * Math.PI);

      const duration = 5000;
      const startAngle = currentAngle;
      const startTime = performance.now();

      function animate(time) {
        let elapsed = time - startTime;
        if (elapsed > duration) elapsed = duration;

        const progress = elapsed / duration;
        const easeOut = 1 - Math.pow(1 - progress, 4);

        currentAngle = startAngle + (targetAngle - startAngle) * easeOut;
        drawWheel();

        if (elapsed < duration) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          showResult(winningIndex);
        }
      }

      requestAnimationFrame(animate);
    }

    function showResult(index) {
      currentPrize = sectors[index];

      if (currentPrize.value > 0) {
        document.getElementById('giftTitle').innerText = `Вы выиграли ${currentPrize.label}!`;
        document.getElementById('giftModal').classList.add('show');
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      } else {
        resultText.innerText = "Увы, пусто! Попробуй ещё раз 🚀";
      }

      updateUI();
    }

    /* Модальное окно Подарка */
    function claimGift() {
      if (tg) {
        tg.sendData(JSON.stringify({ action: "claim_gift", prize: currentPrize.label }));
      }
      resultText.innerText = `🎁 Подарок "${currentPrize.label}" отправлен вам!`;
      document.getElementById('giftModal').classList.remove('show');
    }

    function exchangeGift() {
      if (currentPrize) {
        changeBalance(currentPrize.value);
        resultText.innerText = `⭐ Подарок обменян на +${currentPrize.value} ⭐!`;
      }
      document.getElementById('giftModal').classList.remove('show');
    }

    /* Навигация ⚙️ */
    function openModal() { document.getElementById('menuModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('menuModal').style.display = 'none'; }
    
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(`tab-${tabName}`).classList.add('active');
    }

    updateUI();
    drawWheel();
  </script>
</body>
</html>
