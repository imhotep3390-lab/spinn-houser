<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Spin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #030014;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }
    .space-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at 20% 20%, rgba(147, 51, 234, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, #030014 100%);
      z-index: 0;
    }
    .balance-bar {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(30, 27, 75, 0.8);
      border: 1px solid rgba(168, 85, 247, 0.5);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 700;
      color: #facc15;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .bal-plus-btn {
      background: #a855f7;
      color: #fff;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
    }
    h1 {
      font-size: 26px;
      font-weight: 900;
      margin-top: 40px;
      margin-bottom: 20px;
      text-align: center;
      color: #c084fc;
      text-shadow: 0 0 20px rgba(192, 132, 252, 0.6);
      z-index: 2;
    }
    .wheel-container {
      position: relative;
      width: 320px;
      height: 320px;
      margin-bottom: 20px;
      z-index: 2;
    }
    .pointer {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 28px solid #f43f5e;
      z-index: 10;
      filter: drop-shadow(0 0 10px #f43f5e);
    }
    .center-cap {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 54px; height: 54px;
      background: radial-gradient(circle, #38bdf8 0%, #1e1b4b 100%);
      border: 3px solid #c084fc;
      border-radius: 50%;
      z-index: 5;
      box-shadow: 0 0 15px #38bdf8;
    }
    canvas {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }
    .btn-spin {
      background: linear-gradient(135deg, #a855f7, #6366f1);
      color: #fff;
      border: none;
      padding: 16px 45px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
      transition: transform 0.1s;
      z-index: 2;
    }
    .btn-spin:active { transform: scale(0.95); }
    .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; }
    .result {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      min-height: 28px;
      color: #facc15;
      z-index: 2;
    }
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 0, 20, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #1e1b4b;
      border: 2px solid #a855f7;
      border-radius: 24px;
      padding: 25px;
      width: 100%;
      max-width: 300px;
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
      position: relative;
      text-align: center;
    }
    .close-btn {
      position: absolute;
      top: 15px; right: 15px;
      background: none; border: none;
      color: #a855f7; font-size: 22px; cursor: pointer;
    }
    .deposit-option {
      background: rgba(168, 85, 247, 0.2);
      border: 1px solid #a855f7;
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      width: 100%;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .gift-modal {
      position: fixed;
      bottom: -100%;
      left: 0; right: 0;
      background: #1e1b4b;
      border-top: 3px solid #ec4899;
      border-radius: 25px 25px 0 0;
      padding: 25px 20px;
      z-index: 90;
      transition: bottom 0.4s;
      text-align: center;
    }
    .gift-modal.show { bottom: 0; }
    .action-btn {
      width: 100%; padding: 12px; border-radius: 12px; border: none;
      font-size: 15px; font-weight: bold; margin-top: 8px; cursor: pointer;
    }
    .btn-claim { background: #10b981; color: #fff; }
    .btn-exchange { background: #3b82f6; color: #fff; }
  </style>
</head>
<body>

  <div class="space-bg"></div>

  <div class="balance-bar">
    <span id="balanceVal">10</span> ⭐
    <button class="bal-plus-btn" onclick="openDeposit()">+</button>
  </div>

  <h1>GALAXY SPIN</h1>

  <div class="wheel-container">
    <div class="pointer"></div>
    <div class="center-cap"></div>
    <canvas id="wheel" width="600" height="600"></canvas>
  </div>

  <button class="btn-spin" id="spinBtn" onclick="spin()">КРУТИТЬ (5 ⭐)</button>
  <div class="result" id="resultText"></div>

  <div class="modal" id="depositModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeDeposit()">✕</button>
      <h3>⭐ Пополнение</h3>
      <p style="margin-top: 10px; color: #94a3b8; font-size: 14px;">Выберите сумму ⭐:</p>
      <button class="deposit-option" onclick="addBalance(20)">+20 ⭐</button>
      <button class="deposit-option" onclick="addBalance(50)">+50 ⭐</button>
      <button class="deposit-option" onclick="addBalance(100)">+100 ⭐</button>
    </div>
  </div>

  <div class="gift-modal" id="giftModal">
    <div style="font-size: 50px;">🎁</div>
    <h3 id="giftTitle" style="margin-top: 5px;">Приз!</h3>
    <button class="action-btn btn-claim" onclick="claimGift()">🎁 Забрать подарок</button>
    <button class="action-btn btn-exchange" onclick="exchangeGift()">⭐ Обменять на баланс</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const SPIN_COST = 5;
    let userBalance = parseInt(localStorage.getItem('starsBalance')) || 10;
    let currentPrize = null;

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const resultText = document.getElementById('resultText');
    const balanceVal = document.getElementById('balanceVal');

    function updateUI() {
      balanceVal.innerText = userBalance;
      localStorage.setItem('starsBalance', userBalance);

      if (userBalance < SPIN_COST && !isSpinning) {
        spinBtn.disabled = true;
        resultText.innerText = "Недостаточно ⭐!";
      } else if (!isSpinning) {
        spinBtn.disabled = false;
      }
    }

    function openDeposit() { document.getElementById('depositModal').style.display = 'flex'; }
    function closeDeposit() { document.getElementById('depositModal').style.display = 'none'; }
    
    function addBalance(amount) {
      userBalance += amount;
      updateUI();
      closeDeposit();
    }

    const sectors = [
      { label: "100 ⭐", value: 100, color: "#ec4899" },
      { label: "ПУСТО", value: 0, color: "#1e1b4b" },
      { label: "50 ⭐", value: 50, color: "#a855f7" },
      { label: "ПУСТО", value: 0, color: "#0f172a" },
      { label: "25 ⭐", value: 25, color: "#3b82f6" },
      { label: "15 ⭐", value: 15, color: "#06b6d4" }
    ];

    const numSectors = sectors.length;
    const arc = (2 * Math.PI) / numSectors;
    let currentAngle = 0;
    let isSpinning = false;

    function drawWheel() {
      const radius = canvas.width / 2;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numSectors; i++) {
        const angle = currentAngle + i * arc;
        
        ctx.beginPath();
        ctx.fillStyle = sectors[i].color;
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, angle, angle + arc);
        ctx.lineTo(radius, radius);
        ctx.fill();

        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 28px sans-serif";
        ctx.textAlign = "right";
        ctx.translate(radius, radius);
        ctx.rotate(angle + arc / 2);
        ctx.fillText(sectors[i].label, radius - 35, 10);
        ctx.restore();
      }
    }

    function getRandomSectorIndex() {
      const rand = Math.random() * 100;
      if (rand < 1) return 0;
      if (rand < 6) return 2;
      if (rand < 16) return 4;
      if (rand < 31) return 5;
      return Math.random() < 0.5 ? 1 : 3;
    }

    function spin() {
      if (isSpinning || userBalance < SPIN_COST) return;

      userBalance -= SPIN_COST;
      updateUI();

      isSpinning = true;
      spinBtn.disabled = true;
      resultText.innerText = "Вращение...";

      const winningIndex = getRandomSectorIndex();

      const targetAngleOnCircle = 2 * Math.PI - (winningIndex * arc + arc / 2) - Math.PI / 2;
      const extraRotations = (5 + Math.floor(Math.random() * 3)) * 2 * Math.PI;
      const currentMod = currentAngle % (2 * Math.PI);
      const targetAngle = currentAngle + extraRotations + (targetAngleOnCircle - currentMod + 2 * Math.PI) % (2 * Math.PI);

      const duration = 4000;
      const startAngle = currentAngle;
      const startTime = performance.now();

      function animate(time) {
        let elapsed = time - startTime;
        if (elapsed > duration) elapsed = duration;

        const progress = elapsed / duration;
        const easeOut = 1 - Math.pow(1 - progress, 3);

        currentAngle = startAngle + (targetAngle - startAngle) * easeOut;
        drawWheel();

        if (elapsed < duration) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          showResult(winningIndex);
        }
      }

      requestAnimationFrame(animate);
    }

    function showResult(index) {
      currentPrize = sectors[index];

      if (currentPrize.value > 0) {
        document.getElementById('giftTitle').innerText = `Вы выиграли ${currentPrize.label}!`;
        document.getElementById('giftModal').classList.add('show');
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      } else {
        resultText.innerText = "Увы, в этот раз пусто! 🚀";
      }

      updateUI();
    }

    function claimGift() {
      if (tg) tg.sendData(JSON.stringify({ action: "claim", prize: currentPrize.label }));
      resultText.innerText = `🎁 Подарок "${currentPrize.label}" забран!`;
      document.getElementById('giftModal').classList.remove('show');
    }

    function exchangeGift() {
      if (currentPrize) {
        userBalance += currentPrize.value;
        resultText.innerText = `⭐ Обменяно на +${currentPrize.value} ⭐!`;
      }
      document.getElementById('giftModal').classList.remove('show');
      updateUI();
    }

    updateUI();
    drawWheel();
  </script>
</body>
</html>
