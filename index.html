    * {

    body {

      display: flex;

      align-items: center;

      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    .space-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background:

        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, #030014 100%);
      z-index: 0;
    }

    .top-bar {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .settings-btn {
      background: rgba(30, 27, 75, 0.8);
      border: 1px solid rgba(168, 85, 247, 0.5);
      color: #fff;
      font-size: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
      backdrop-filter: blur(10px);
    }

    .balance-bar {
      background: rgba(30, 27, 75, 0.8);
      border: 1px solid rgba(168, 85, 247, 0.5);

      box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bal-btn {
      background: rgba(168, 85, 247, 0.3);
      border: 1px solid #a855f7;
      color: #fff;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 26px;
      font-weight: 900;
      margin-top: 50px;
      margin-bottom: 20px;
      text-align: center;
      background: linear-gradient(135deg, #a855f7, #38bdf8, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
      z-index: 2;
    }

    .wheel-wrapper {
      position: relative;
      width: 310px;
      height: 310px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .wheel-frame {
      position: absolute;
      width: 310px;
      height: 310px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1e1b4b, #0f172a);
      border: 4px solid #38bdf8;
      box-shadow: 0 0 20px #a855f7, inset 0 0 15px #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pointer {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 42px;
      z-index: 10;
      filter: drop-shadow(0 0 12px #f43f5e);
    }
    .pointer-shape {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #ff4b72, #9f1239);
      clip-path: polygon(50% 100%, 0 0, 50% 20%, 100% 0);
      border-radius: 4px;
    }

    .center-cap {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 56px; height: 56px;
      background: radial-gradient(circle, #38bdf8 0%, #030014 90%);
      border: 3px solid #a855f7;
      border-radius: 50%;
      z-index: 5;
      box-shadow: 0 0 20px #38bdf8;
      display: flex; align-items: center; justify-content: center;
    }
    .center-cap::after {
      content: '✦';
      font-size: 20px;
      color: #fff;
    }

      z-index: 3;
      border-radius: 50%;
